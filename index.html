<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Julieth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{
  font-family:Poppins,sans-serif;
  overflow-x:hidden;
}
#flowers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.falling{
  position:absolute;
  top:-50px;
  color:#ffd83d;
  filter:drop-shadow(0 0 7px rgba(255,216,61,.45));
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translate3d(0,-50px,0) rotate(0deg);opacity:0}
  10%{opacity:.95}
  100%{transform:translate3d(var(--drift),110vh,0) rotate(360deg);opacity:.15}
}

#lock{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  background:#000;
  transition:opacity .8s,visibility .8s;
}
.lock-card{
  width:min(420px,90vw);
  padding:42px 30px;
  text-align:center;
  border:1px solid rgba(255,216,61,.35);
  border-radius:24px;
  background:rgba(8,8,8,.92);
  box-shadow:0 0 50px rgba(255,216,61,.12);
}
.lock-card h1{font-family:"DM Serif Display",serif;color:#ffd83d;font-size:42px;margin:0 0 10px}
.lock-card p{color:#ccc;margin:0 0 25px}
input{
  width:100%;padding:15px 18px;border-radius:13px;
  border:1px solid #555;background:#111;color:white;
  outline:none;text-align:center;font-size:18px;
}
button{
  margin-top:14px;width:100%;padding:14px;border:0;border-radius:13px;
  background:#ffd83d;color:#000;font-weight:600;font-size:16px;cursor:pointer;
}
#error{height:22px;color:#ff7777;font-size:13px;margin-top:10px}
body.unlocked #lock{opacity:0;visibility:hidden}

main{
  position:relative;z-index:2;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:70px 20px;
}
.card{
  width:min(900px,94vw);
  padding:38px 25px 45px;
  border:1px solid rgba(255,216,61,.28);
  border-radius:30px;
  background:rgba(7,7,7,.82);
  box-shadow:0 0 80px rgba(255,216,61,.08);
  text-align:center;
  backdrop-filter:blur(5px);
}
h2{
  font-family:"DM Serif Display",serif;
  color:#ffd83d;font-size:clamp(42px,7vw,72px);
  margin:0 0 8px;
}
.subtitle{color:#bbb;margin:0 0 28px}

.flower-stage{
  position:relative;
  width:min(650px,90vw);
  margin:auto;
  min-height:520px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* The supplied flower SVG is revealed piece-by-piece with motion. */
.flower-drawing{
  width:min(620px,88vw);
  max-height:70vh;
  opacity:0;
  transform:scale(.72) rotate(-5deg);
  filter:drop-shadow(0 0 0 rgba(255,216,61,0));
  clip-path:inset(0 50% 100% 50%);
}
body.unlocked .flower-drawing{
  animation:flowerReveal 2.8s cubic-bezier(.16,1,.3,1) .35s forwards,
            flowerGlow 2s ease 2.8s forwards;
}
@keyframes flowerReveal{
  0%{opacity:0;transform:scale(.72) rotate(-5deg);clip-path:inset(0 50% 100% 50%)}
  18%{opacity:.25}
  42%{clip-path:inset(0 38% 55% 38%);transform:scale(.84) rotate(3deg)}
  68%{clip-path:inset(0 18% 20% 18%);transform:scale(.95) rotate(-1.5deg)}
  86%{clip-path:inset(0 4% 4% 4%);transform:scale(1.02) rotate(.6deg)}
  100%{opacity:1;clip-path:inset(0 0 0 0);transform:scale(1) rotate(0)}
}
@keyframes flowerGlow{
  0%{filter:drop-shadow(0 0 0 rgba(255,216,61,0))}
  100%{filter:drop-shadow(0 0 22px rgba(255,216,61,.25))}
}

.message{
  margin:20px auto 0;max-width:650px;
  color:#eee;line-height:1.8;font-size:16px;
}
@media(max-width:600px){
  .flower-stage{min-height:380px}
  .card{padding:30px 14px 35px}
}
</style>
</head>
<body>
<div id="flowers"></div>

<section id="lock">
  <div class="lock-card">
    <h1>Para Julieth</h1>
    <p>Hay algo especial esperando detrás de esta puerta.</p>
    <input id="pass" type="password" inputmode="numeric" maxlength="2" placeholder="Contraseña">
    <button id="enter">Entrar</button>
    <div id="error"></div>
  </div>
</section>

<main>
  <div class="card">
    <h2>Para Julieth</h2>
    <p class="subtitle">Una pequeña sorpresa hecha especialmente para ti.</p>

    <div class="flower-stage">
      <img class="flower-drawing" src="sunflower.svg" alt="Flores amarillas para Julieth">
    </div>

    <p class="message">
      Que siempre encuentres un poquito de sol, incluso en los días nublados. 💛
    </p>
  </div>
</main>

<script>
const pass=document.getElementById('pass');
const enter=document.getElementById('enter');
const error=document.getElementById('error');

function unlock(){
  if(pass.value==='21'){
    document.body.classList.add('unlocked');
    error.textContent='';
  }else{
    error.textContent='Contraseña incorrecta';
    pass.value='';
    pass.focus();
  }
}
enter.addEventListener('click',unlock);
pass.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

const container=document.getElementById('flowers');
const symbols=['✿','❀','✦','🌼'];
function createFlower(){
  const f=document.createElement('span');
  f.className='falling';
  f.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  f.style.left=Math.random()*100+'vw';
  f.style.fontSize=(10+Math.random()*13)+'px';
  f.style.setProperty('--drift',(Math.random()*160-80)+'px');
  f.style.animationDuration=(7+Math.random()*8)+'s';
  container.appendChild(f);
  setTimeout(()=>f.remove(),16000);
}
setInterval(createFlower,500);
for(let i=0;i<12;i++) setTimeout(createFlower,i*180);
</script>
</body>
</html>
